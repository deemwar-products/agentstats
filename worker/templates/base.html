<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}agentstats{% endblock %}</title>
<meta name="description" content="An honest before-agents vs after-agents card of the code you actually wrote.">
{% block head %}{% endblock %}
<style>
:root { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --accent:#f78166; --panel:#161b22; --line:#30363d; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; line-height:1.5; }
main { max-width:820px; margin:0 auto; padding:32px 16px 64px; }
a { color:var(--accent); }
h1 { font-size:2rem; margin:.2em 0; }
h2 { font-size:1.25rem; margin-top:2em; border-bottom:1px solid var(--line); padding-bottom:.3em; }
.muted { color:var(--muted); }
.card-img { width:100%; max-width:800px; border:1px solid var(--line); border-radius:12px; margin:12px 0; background:var(--panel); }
pre, code { background:var(--panel); border:1px solid var(--line); border-radius:8px; }
pre { padding:12px; overflow:auto; font-size:.85rem; }
code { padding:1px 5px; }
.btn { display:inline-block; background:var(--accent); color:#0d1117; padding:10px 18px; border-radius:8px; text-decoration:none; font-weight:600; }
footer { border-top:1px solid var(--line); margin-top:48px; padding-top:16px; color:var(--muted); font-size:.9rem; }
ul { padding-left:20px; }
</style>
</head>
<body>
<main>
{% block content %}{% endblock %}
<footer>
<a href="{{ deemwar }}">{{ footer }}</a> · we read commit stats, not your code · private repos contribute only aggregate numbers · tokens are used for the job and discarded.
</footer>
</main>
</body>
</html>
